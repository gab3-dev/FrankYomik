name: frank_client
description: "Frank Yomik Japanese study reader with local PDF library, tap dictionary, and manga/webtoon tools"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  web_socket_channel: ^3.0.0
  http: ^1.0.0
  flutter_riverpod: ^2.0.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  image: ^4.0.0
  crypto: ^3.0.0
  path: ^1.8.0
  uuid: ^4.0.0
  url_launcher: ^6.2.0
  pdfrx: ^2.3.4
  file_picker: ^10.3.10
  archive: ^4.2.0
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
